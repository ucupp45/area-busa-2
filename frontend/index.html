<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/royal-corp-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPP BUSA 2</title>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) { 
        document.body.innerHTML += '<div style="color:red;z-index:9999;position:fixed;top:0;left:0;background:white;padding:20px;width:100vw;height:100vh;overflow:auto;">' + msg + '<br>' + (error && error.stack ? error.stack.replace(/\n/g, '<br>') : '') + '</div>'; 
        return false; 
      };
    </script>
  </body>
